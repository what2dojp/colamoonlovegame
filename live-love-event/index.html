<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💘 七夕戀愛事件進行中</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="stars"></div>
      <div class="hearts"></div>
    </div>

    <div class="app">
      <header class="event-banner">
        <p class="live-pill"><span class="live-dot"></span> LIVE EVENT</p>
        <h1>💘 七夕戀愛事件進行中</h1>
        <p class="subtitle">「可樂海王後宮失火啦」</p>
        <p id="live-event" class="live-event" aria-live="polite">
          🔥 火星與月月正在互相傷害中
        </p>
        <div class="marquee" aria-label="觀眾互動紀錄">
          <div id="marquee-track" class="marquee-track"></div>
        </div>
      </header>

      <section class="character-section" aria-label="角色狀態庫">
        <div class="section-title">
          <h2>✨ 角色狀態庫</h2>
          <p>好感度會即時跳動，醋意值也是。</p>
        </div>
        <div id="character-grid" class="character-grid"></div>
      </section>

      <section class="control-section" aria-label="命運干預">
        <h2>🔮 命運干預</h2>
        <p class="control-hint">選一個招式，再指定要攪局的對象。</p>
        <div class="action-row" id="action-row">
          <button class="action-btn" type="button" data-action="letter">
            <span class="btn-face">💌 傳遞情書</span>
            <span class="btn-cool" hidden></span>
          </button>
          <button class="action-btn" type="button" data-action="peek">
            <span class="btn-face">👀 偷看秘密</span>
            <span class="btn-cool" hidden></span>
          </button>
          <button class="action-btn" type="button" data-action="encounter">
            <span class="btn-face">💘 製造偶遇</span>
            <span class="btn-cool" hidden></span>
          </button>
          <button class="action-btn" type="button" data-action="sabotage">
            <span class="btn-face">💥 破壞約會</span>
            <span class="btn-cool" hidden></span>
          </button>
        </div>
      </section>
    </div>

    <div id="target-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p class="modal-kicker" id="modal-action-label">命運干預</p>
        <h3 id="modal-title">選擇標角色</h3>
        <div id="target-list" class="target-list"></div>
        <button class="modal-cancel" type="button" data-close="true">取消</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
